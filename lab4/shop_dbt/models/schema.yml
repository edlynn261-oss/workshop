version: 2

models:
  - name: stg_orders
    description: One clean row per order
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["paid", "shipped", "cancelled"]

  - name: dim_customers
    description: One row per customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: fct_order_items
    description: One row per product sold (cancelled orders removed)
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
