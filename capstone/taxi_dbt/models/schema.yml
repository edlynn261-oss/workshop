version: 2

models:
  - name: stg_zones
    columns:
      - name: zone_id
        data_tests:
          - unique
          - not_null

  - name: stg_trips
    columns:
      - name: pickup_at
        data_tests:
          - not_null
      - name: pickup_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: zone_id

  - name: trips_by_month
    columns:
      - name: pickup_month
        data_tests:
          - unique
          - not_null
